<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت آکسیو</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0f;font-family:'Vazir',sans-serif;color:#eee;padding:20px}
        .container{max-width:1200px;margin:0 auto}
        .header{background:#111;border-radius:24px;padding:16px 24px;margin-bottom:24px;text-align:center}
        h1{color:#ffd966;font-size:1.5rem}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:30px}
        .stat-card{background:#1a1a2a;border-radius:20px;padding:24px;text-align:center}
        .stat-number{font-size:2.5rem;font-weight:700;color:#ffd966}
        .stat-label{color:#888;margin-top:8px}
        .panel{background:#111;border-radius:24px;padding:24px;margin-bottom:24px}
        .panel h3{color:#ffd966;margin-bottom:16px}
        input,select{background:#1a1a2a;border:1px solid #333;padding:12px 16px;border-radius:12px;color:#fff;margin:5px;width:200px}
        button{background:#ffd966;border:none;padding:12px 24px;border-radius:12px;color:#111;font-weight:600;cursor:pointer;margin:5px}
        button:hover{background:#e8c44a}
        .match-item{background:#1a1a2a;border-radius:16px;padding:16px;margin-bottom:12px}
        .flex{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
        .toast{position:fixed;bottom:20px;right:20px;background:#1a3a1a;padding:12px 24px;border-radius:12px;display:none;z-index:1000}
        table{width:100%;border-collapse:collapse}
        th,td{padding:12px;text-align:center;border-bottom:1px solid #222}
        th{color:#ffd966}
        .loading{text-align:center;padding:40px;color:#888}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⚽ پنل مدیریت آکسیو · جام جهانی ۲۰۲۶</h1>
    </div>

    <div class="stats" id="statsArea">
        <div class="stat-card"><div class="stat-number" id="totalUsers">-</div><div class="stat-label">کل کاربران</div></div>
        <div class="stat-card"><div class="stat-number" id="totalPredictions">-</div><div class="stat-label">کل پیش‌بینی‌ها</div></div>
        <div class="stat-card"><div class="stat-number" id="totalPoints">-</div><div class="stat-label">کل امتیازات توزیع شده</div></div>
    </div>

    <div class="panel">
        <h3>📋 ثبت نتیجه بازی</h3>
        <div class="flex">
            <input type="text" id="matchId" placeholder="شناسه بازی (مثال: M05)">
            <input type="text" id="matchScore" placeholder="نتیجه (مثال: 2-1)">
            <button onclick="submitResult()">ثبت نتیجه</button>
        </div>
    </div>

    <div class="panel">
        <h3>🔑 بازنشانی رمز کاربر</h3>
        <div class="flex">
            <input type="text" id="resetRobotId" placeholder="آیدی روبیکا">
            <button onclick="resetPassword()">بازنشانی رمز</button>
        </div>
    </div>

    <div class="panel">
        <h3>🏆 محاسبه امتیازات نهایی</h3>
        <button onclick="calculateRewards()">شروع محاسبه امتیازات</button>
    </div>

    <div class="panel">
        <h3>📊 لیست کاربران</h3>
        <div id="usersList" class="loading">در حال بارگذاری...</div>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwqkMUH_FMmoU9fTIpT5-sIKGKBbLQfwkC-AoFDNMo6JfS_YoEpQ8cOz-bBhXUTt3uS8Q/exec';

function showToast(msg, isErr) {
    let t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    t.style.background = isErr ? '#5a2a2a' : '#1a3a1a';
    setTimeout(() => t.style.display = 'none', 3000);
}

async function callAPI(action, data = {}) {
    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action, ...data })
        });
        return await res.json();
    } catch(e) {
        showToast('خطا در ارتباط با سرور', true);
        return null;
    }
}

async function loadStats() {
    const adminToken = localStorage.getItem('adminToken');
    if (!adminToken) return;
    
    const res = await callAPI('admin_stats', { admin_token: adminToken });
    if (res && res.status === 'success') {
        document.getElementById('totalUsers').innerText = res.total_users || 0;
        document.getElementById('totalPredictions').innerText = res.total_predictions || 0;
        document.getElementById('totalPoints').innerText = res.total_points_awarded || 0;
    }
}

async function loadUsers() {
    const adminToken = localStorage.getItem('adminToken');
    if (!adminToken) return;
    
    const res = await callAPI('leaderboard');
    if (res && res.status === 'success') {
        let html = '<table><thead><tr><th>رتبه</th><th>آیدی روبیکا</th><th>امتیاز</th></tr></thead><tbody>';
        for (let u of res.leaderboard) {
            html += `<tr><td>${u.rank}</td><td>${u.robot_id}</td><td>${u.points}</td></tr>`;
        }
        html += '</tbody></table>';
        document.getElementById('usersList').innerHTML = html;
    } else {
        document.getElementById('usersList').innerHTML = '<div class="loading">خطا در بارگذاری</div>';
    }
}

async function submitResult() {
    const matchId = document.getElementById('matchId').value.trim();
    const score = document.getElementById('matchScore').value.trim();
    
    if (!matchId || !score) {
        showToast('شناسه بازی و نتیجه را وارد کنید', true);
        return;
    }
    
    const adminToken = localStorage.getItem('adminToken');
    if (!adminToken) {
        showToast('لطفاً ابتدا وارد شوید', true);
        return;
    }
    
    const res = await callAPI('admin_set_result', {
        admin_token: adminToken,
        match_id: matchId,
        score: score
    });
    
    if (res && res.status === 'success') {
        showToast('نتیجه با موفقیت ثبت شد');
        document.getElementById('matchId').value = '';
        document.getElementById('matchScore').value = '';
    } else {
        showToast(res?.message || 'خطا در ثبت نتیجه', true);
    }
}

async function resetPassword() {
    const robotId = document.getElementById('resetRobotId').value.trim();
    
    if (!robotId) {
        showToast('آیدی روبیکا را وارد کنید', true);
        return;
    }
    
    const adminToken = localStorage.getItem('adminToken');
    if (!adminToken) {
        showToast('لطفاً ابتدا وارد شوید', true);
        return;
    }
    
    const res = await callAPI('admin_reset_password', {
        admin_token: adminToken,
        robot_id: robotId
    });
    
    if (res && res.status === 'success') {
        showToast(`رمز جدید: ${res.temp_password}`);
        document.getElementById('resetRobotId').value = '';
    } else {
        showToast(res?.message || 'خطا در بازنشانی رمز', true);
    }
}

async function calculateRewards() {
    const adminToken = localStorage.getItem('adminToken');
    if (!adminToken) {
        showToast('لطفاً ابتدا وارد شوید', true);
        return;
    }
    
    const res = await callAPI('admin_calculate', { admin_token: adminToken });
    if (res && res.status === 'success') {
        showToast('امتیازات با موفقیت محاسبه شد');
        loadStats();
        loadUsers();
    } else {
        showToast(res?.message || 'خطا در محاسبه امتیازات', true);
    }
}

async function autoLogin() {
    const res = await callAPI('admin_login', { password: '&:&:&jdhdhsnusuhxnnjjsjsjsnbdhdjxnn$usjjdudii$$$762262783&$$$;$;!;$:7' });
    if (res && res.status === 'success') {
        localStorage.setItem('adminToken', res.admin_token);
        loadStats();
        loadUsers();
    } else {
        showToast('خطا در اتصال به پنل مدیریت', true);
    }
}

autoLogin();
</script>
</body>
</html>
